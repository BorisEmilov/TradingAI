# Configuracion general del proyecto (no sensible; las credenciales van en .env)

trading:
  mode: paper                 # paper | live
  symbols: [
    "EURUSD", "GBPUSD", "USDJPY", "US500",
    "EURCAD", "EURAUD", "USDCAD", "AUDUSD", "GBPAUD", "GBPCAD",
    "EURJPY", "GBPJPY", "USDCHF", "NZDUSD",
  ]
  # XAUUSD (oro) sacado del piloto el 2026-08-25 por decision explicita del usuario
  # tras un SL de -$960.21 -- el oro se mueve con una volatilidad/tamaño de punto muy
  # distinto al resto de pares FX, y el usuario prefirio no seguir operandolo por
  # ahora. Volver a incluirlo en la lista de arriba si se decide retomarlo.
  #
  # EURGBP sacado el 2026-08-27 (decision del manager tecnico, no del usuario a
  # ciegas -- ver memoria del proyecto): 3 señales independientes en la misma
  # direccion. (1) unico simbolo no promovido en el reentreno del 2026-08-26
  # (2/4 folds, pnl medio -0.27%). (2) unico fold negativo en el walk-forward
  # completo del 2026-08-25 (63/64 positivos). (3) peor simbolo del dia el
  # 2026-08-26 (0/3 ganadas, pnl=-$476.15), con las 3 perdidas en confianza
  # 90-93% -- el modelo esta confiadamente equivocado en este simbolo, no dudando,
  # por lo que subir el umbral de confianza NO habria evitado esas perdidas
  # (se evaluo esa alternativa y se descarto con datos, no a ojo).
  risk_per_trade_pct: 1.0
  # Subido de 3 a 4 el 2026-08-27 (pedido explicito): con risk_per_trade_pct=1.0 y
  # max_portfolio_risk_pct=10.0 mas abajo, 4 posiciones siguen muy por debajo del
  # tope de VaR agregado (4% vs 10% en el peor caso). Este VALOR de aca es ahora la
  # fuente de verdad real (bug real encontrado el mismo dia: antes lo leia
  # `secrets.max_open_positions`/.env, y este valor de config.yaml no tenia ningun
  # efecto -- ver run_live.py).
  max_open_positions: 4
  # Techo ALTO (no ilimitado) para señales de confianza muy alta que superen el
  # limite normal de arriba -- pedido explicito del 2026-08-27 tras ver operaciones
  # de 76-90% de confianza rechazadas solo por el limite de posiciones. Se decidio
  # NO dejarlo sin techo (confianza alta no es lo mismo que "seguro": el modelo
  # puede estar muy confiado y equivocado, y sin techo un dia con muchos simbolos
  # confiados a la vez podria acumular exposicion correlacionada sin control). El
  # resto de controles (VaR de portafolio, correlacion por divisa) se siguen
  # aplicando igual a estas señales. null = sin excepcion (max_open_positions sigue
  # siendo un techo absoluto).
  max_open_positions_high_confidence: 6
  high_confidence_override: 0.90
  max_margin_pct_per_trade: 10.0  # tope de margen por operacion (independiente del sizing por riesgo)
  max_daily_drawdown_pct: 5.0
  min_risk_reward_ratio: 2.0   # piso duro: la IA puede pedir mas, nunca menos (ver RiskManager)

  # Horario permitido en UTC (7-21 cubre solapamiento Londres/Nueva York, evita las
  # horas mas ilíquidas de la sesion asiatica en solitario). null = sin restriccion.
  trading_hours_utc: [7, 21]

  # Limite de posiciones abiertas que comparten exposicion a la MISMA divisa en la
  # MISMA direccion -- derivado automaticamente del nombre de cada simbolo
  # (RiskManager._currency_exposures), no de una lista fija de grupos. Ej. LONG
  # EURUSD + LONG EURJPY + LONG EURGBP son 3 apuestas alcistas sobre EUR aunque sean
  # 3 simbolos distintos sin ningun par literal repetido -- una lista de grupos fija
  # no detectaria esto (gap real expuesto al anadir pares cruzados el 2026-08-24).
  max_correlated_same_direction: 2

  # Tope de posiciones abiertas en el MISMO simbolo (sin importar direccion). Anadido
  # el 2026-08-24: el piloto abrio 2 SHORT EURGBP casi al mismo precio en ciclos
  # consecutivos porque nada lo impedia -- duplica el riesgo real sobre ese
  # movimiento de precio especifico. null = sin limite (permite piramidar).
  max_positions_per_symbol: 1

  # VaR simplificado de portafolio: tope de perdida agregada (% del balance) si
  # TODAS las posiciones abiertas + la señal nueva tocaran su stop loss a la vez.
  # Los limites de arriba acotan riesgo por operacion/simbolo/divisa, pero ninguno
  # responde a "cuanto podria perder la cuenta si el peor escenario le pega a los
  # 16 simbolos combinados". null = sin limite.
  max_portfolio_risk_pct: 10.0

  # Filtro de calendario economico: pausa el trading alrededor de eventos de alto
  # impacto (NFP, FOMC, CPI). NFP se calcula solo (primer viernes de mes, 8:30 ET,
  # ajustado a horario de verano/invierno). FOMC/CPI NO siguen una regla fija --
  # anadir aqui las fechas reales segun se publiquen (federalreserve.gov para FOMC,
  # bls.gov para CPI). Lista vacia = esos dos eventos no se bloquean todavia.
  news_calendar:
    enabled: true
    minutes_before: 15
    minutes_after: 15
    nfp:
      enabled: true
      time_et: "08:30"
    manual_events: []
      # - {date: "2026-MM-DD", time_utc: "HH:MM", label: "FOMC"}
      # - {date: "2026-MM-DD", time_utc: "HH:MM", label: "CPI"}

  # Distancia minima del SL respecto al spread actual, en veces el spread (bid-ask).
  # Anadido el 2026-08-24 tras el piloto en vivo: con ATR bajo, el SL calculado podia
  # quedar a solo 3-5x el spread -- demasiado cerca, se activaba por ruido/spread en
  # vez de por una reversion real del precio. Rechaza la señal si no se cumple.
  min_sl_spread_multiple: 5.0

  # Trailing stop basado en estructura (2026-08-25): una vez que la operacion lleva
  # `activate_at_r_multiple` veces su riesgo inicial en beneficio, mueve el SL a la
  # ultima zona clave de estructura (swing high/low confirmado) a favor del precio,
  # nunca al reves -- ver tradingai.mt5.trailing_stop. NO es un trailing por distancia
  # fija/ATR: el usuario pidio explicitamente que el ajuste tenga sentido tecnico, no
  # que se mueva de forma aleatoria.
  trailing_stop:
    enabled: true
    activate_at_r_multiple: 1.0
    swing_left: 3
    swing_right: 3
    swing_lookback_candles: 100

  # Salida escalonada (2026-08-26, pedido explicito): cierra `close_fraction` del
  # volumen al alcanzar un primer TP conservador situado a `tp1_fraction` del camino
  # entre la entrada y el TP original, y deja el resto corriendo gestionado por el
  # trailing stop de arriba -- ver tradingai.mt5.scaled_exit. Con el R:R por defecto
  # (sl_atr_mult=2.0, tp_atr_mult=4.0) tp1_fraction=0.5 pone el primer TP en 1R, el
  # mismo punto en el que se activa el trailing.
  scaled_exit:
    enabled: true
    tp1_fraction: 0.5
    close_fraction: 0.5
    # 2026-08-26 (pedido explicito, tras ver en vivo un caso donde el cierre parcial
    # no vino acompañado de ningun ajuste de SL porque el trailing todavia no
    # encontraba una zona de estructura): si tras el cierre parcial el SL sigue peor
    # que breakeven, se fuerza a breakeven. Si el trailing YA lo mejoro mas alla, no
    # se toca -- nunca se afloja lo que el trailing ya movio.
    move_sl_to_breakeven: true

  # Gestion basada en estructura mas alla del TP/SL fijo (2026-08-27, pedido
  # explicito del usuario: "que la ia aprenda a monitorear las operaciones... y
  # cierre si la estructura cambia, o deje correr subiendo el tp"). Ver
  # tradingai.mt5.structure_exit. El SL se deja intacto (lo gestiona
  # trailing_stop/scaled_exit de arriba); esto solo decide CUANDO cerrar antes de
  # tiempo o CUANTO extender el TP.
  #
  # HISTORIAL de invalidation_close_enabled (ver [[project-structure-exit]]):
  # - 2026-08-27: version original basada en apilamiento de EMA20/50/200. Backtest
  #   (3204 operaciones EURUSD/GBPJPY/GBPAUD/USDCHF): expectancy_r 0.450 -> 1.087.
  # - 2026-08-28 manana: PAUSADA -- evidencia en vivo mostro que cortaba mas ganancia
  #   de la que evitaba en perdida (14 cierres, -$332 realizado; los 10 que no habrian
  #   tocado SL mostraban +$2600 combinados si se dejaban correr).
  # - 2026-08-28 tarde: REDEFINIDA -- el usuario objeto (con razon) que EMAs es un
  #   indicador retail, no estructura real. Reemplazada por ruptura de estructura
  #   autentica (Break of Structure/Change of Character sobre swings confirmados,
  #   mismo codigo que ya usa el trailing stop). Backtest con la nueva definicion,
  #   misma muestra: expectancy_r 0.450 -> 1.053 (comparable). REACTIVADA para
  #   recolectar datos en vivo y decidir con evidencia fresca, no solo con backtest
  #   (la leccion de la manana: backtest fuerte no garantiza resultado en vivo).
  structure_exit:
    enabled: true
    invalidation_close_enabled: true
    swing_left: 3
    swing_right: 3
    swing_lookback_candles: 100
    # Anadido el 2026-08-28 (bug real encontrado por el usuario): el watcher sondea
    # cada 30s, asi que sin este piso el cierre por estructura podia evaluarse sobre
    # la MISMA vela M15 que genero la señal de entrada, segundos despues de abrir --
    # eso no es "la estructura cambio", es que nunca estuvo a favor. El backtest de
    # validacion (scripts/backtest_structure_exit.py) siempre revisa desde la vela
    # SIGUIENTE a la entrada, nunca la misma -- este piso iguala eso en vivo.
    min_hold_minutes: 15
    # Anadido el mismo dia (caso real AUDUSD): el modelo de entrada reabrio el MISMO
    # short 6 veces en unas horas contra un sesgo de EMAs establemente alcista,
    # pagando spread cada vez solo para cerrarse casi al instante otra vez por este
    # mismo mecanismo. No cambia el modelo ni el simbolo -- solo evita reabrir en
    # este simbolo hasta que pasen unas velas y el desacuerdo tenga chance de
    # resolverse. Ver _maybe_close_on_structure_invalidation en run_live.py.
    reentry_cooldown_minutes: 30

  # Cortacircuito por perdidas consecutivas (2026-08-28, caso real EURJPY: 7
  # aperturas seguidas en un solo dia, todas short, -$317 neto, incluyendo un SL
  # completo de -$254 al final). A diferencia del cooldown de structure_exit
  # (especifico de ese mecanismo), este cuenta CUALQUIER cierre en perdida seguido
  # sin importar el motivo -- si un simbolo encadena `max_consecutive_losses`
  # perdidas, pausa entradas nuevas en ESE simbolo por `cooldown_minutes`. Se
  # resetea el contador con la primera ganancia. No cambia el modelo ni gestiona
  # posiciones ya abiertas -- solo evita seguir insistiendo en la misma apuesta
  # perdedora el mismo dia.
  consecutive_loss_breaker:
    enabled: true
    max_consecutive_losses: 3
    cooldown_minutes: 120

backtest:
  # Costes de ida y vuelta por operacion (ver Backtester). El spread YA NO es un
  # valor fijo unico para los 15 simbolos (subestimaba los pares cruzados, que en
  # retail suelen costar mas que los majors por menor liquidez) -- ver
  # `spread_pips_by_symbol` abajo. slippage/comision si se mantienen fijos: no hay
  # evidencia todavia de que varien por simbolo de forma tan clara como el spread.
  #
  # 2026-08-26: se intento medir el spread real via MT5, pero la cuenta demo muestra
  # spreads casi nulos (0.0-0.3 pips) en la mayoria de simbolos -- no representativo
  # de una cuenta real, y usarlo habria hecho el backtest MAS optimista, no mas
  # realista. Pendiente: reemplazar por cifras reales del broker cuando se tengan
  # (ver [[project-tradingai-roadmap]]).
  spread_pips_by_symbol: {}
    # EURUSD: 1.0
    # GBPAUD: 2.5
  slippage_pips: 0.2
  commission_pips: 0.0          # 0 en cuentas solo-spread; las ECN suelen cobrar aparte
  max_holding_bars: 50

features:
  smc:
    enabled: true
    swing_lookback: 5           # velas a cada lado para detectar swing highs/lows
    ob_lookback: 50             # ventana para buscar order blocks
    liquidity_lookback: 100     # ventana para equal highs/lows (liquidity pools) y sweeps
    liquidity_sweep_tolerance_pct: 0.05   # tolerancia al comparar el wick contra el nivel
  fvg:
    enabled: true
    min_gap_size_pips: 2.0
    detect_inverted: true        # FVG invalidado (precio lo atraviesa) -> zona volteada
  sessions:
    enabled: true
    # Ventanas horarias UTC (ICT killzones). Solapamiento Londres/NY definido por
    # session_london ∩ session_ny; is_killzone marca las sub-ventanas de mayor probabilidad.
    asia_utc: [0, 7]
    london_utc: [7, 16]
    ny_utc: [12, 21]
    london_killzone_utc: [7, 10]
    ny_killzone_utc: [12, 15]
  volume_profile:
    enabled: true
    bins: 20                    # bins del histograma rolling (features por vela)
    rolling_window: 200         # ventana movil para POC/Value Area por vela (~2 dias en M15)
    value_area_pct: 70          # % de volumen que define la "value area"
  vwap:
    enabled: true                # VWAP anclado a sesion (reset diario 00:00 UTC) + bandas std
  wyckoff:
    enabled: true
    range_window: 20             # velas que definen el rango de trading de referencia
    tolerance_pct: 0.05          # tolerancia al comparar el wick contra el limite del rango
  elliott:
    enabled: true
    deviation_pct: 0.5           # % minimo de movimiento para confirmar un pivote del zigzag
  divergence:
    enabled: true                # divergencias precio vs RSI en swing highs/lows
  indicators:
    enabled: true
    include: ["ema", "rsi", "atr", "macd", "bollinger", "adx"]

model:
  # Analisis top-down multi-temporalidad: bias en D1 -> estructura en H1 -> entrada
  # en M15 (por defecto) o M5 (casos puntuales, ver EntryTimeframeHead). Las entradas
  # SIEMPRE se ejecutan en M15 o M5 — nunca en D1/H1, que solo aportan contexto.
  architecture: transformer     # transformer | lstm (encoder usado en cada temporalidad)

  # Velas de contexto que ve el modelo en cada temporalidad.
  sequence_length:
    D1: 60      # ~3 meses de sesgo diario
    H1: 100      # ~4 dias de estructura
    M15: 96       # ~1 dia de contexto para la entrada
    M5: 60         # ~5 horas de detalle fino

  hidden_size: 128         # tamano del embedding de cada encoder de temporalidad
  fusion_hidden_size: 256  # tamano tras combinar las 4 temporalidades
  num_layers: 2
  num_heads: 4
  dropout: 0.1
  batch_size: 64
  learning_rate: 0.0001
  epochs: 100
  early_stopping_patience: 20

  # Multiplicadores de ATR para TP/SL, usados tanto en el etiquetado (triple barrera,
  # ver ai/training/dataset.py) como en la ejecucion real (ai/inference/gbm_predictor.py)
  # -- deben coincidir siempre entre si (ver docstring de triple_barrier_labels), y con
  # el walk-forward que valida el edge. Ratio 2:1 (piso duro de RiskManager).
  # Subido de 1.0/2.0 a 2.0/4.0 el 2026-08-24: con SL=1xATR el stop quedaba a veces a
  # solo 5-6 pips en EURUSD/GBPUSD (muy cerca del spread), lo que en el piloto en vivo
  # produjo varios stopouts por ruido/spread en vez de por reversion real. Duplicar
  # ambos mantiene el ratio 2:1 pero da paradas mas propias de day-trading.
  sl_atr_mult: 2.0
  tp_atr_mult: 4.0

  # Piso minimo absoluto de distancia del SL, en pips (2026-08-27): evidencia real
  # de 3 dias de piloto en vivo -- las operaciones que quedaron con un SL por ATR
  # menor a ~8 pips ganaron 1/8 (-$1178.89), contra 8/18 (+$493.61) en el resto.
  # Cuando el ATR momentaneo es muy bajo, sl_atr_mult puede dar un SL demasiado
  # corto -- este piso lo evita, escalando el TP proporcionalmente para no alterar
  # el risk:reward configurado (ver tradingai.core.instruments.compute_sl_tp_with_floor).
  # No aplica a indices (US500): "pips" de forex no es una unidad valida ahi.
  min_sl_pips: 12.0

  # Cabezas de prediccion del modelo
  outputs:
    direction: ["long", "short", "neutral"]
    predict_entry: true
    predict_tp: true
    predict_sl: true
    entry_timeframe: ["M15", "M5"]   # en cual ejecutar la entrada
    # Subido de 0.6 a 0.75 el 2026-08-24: el piloto en vivo operaba con demasiada
    # frecuencia (varias señales por ciclo en varios simbolos); un umbral mas alto
    # filtra las señales de conviccion mas baja sin ser tan restrictivo que no opere.
    confidence_threshold: 0.75

paths:
  raw_data: data/raw
  processed_data: data/processed
  models_dir: data/models
  logs_dir: logs
